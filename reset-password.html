<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reimposta password — Lassù dove Volano gli Aquiloni</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section class="login">
  <div class="login-box">
    <h1>Nuova password</h1>
    <p>Inserisci la nuova password.</p>

    <form id="resetForm">
      <input id="newPassword" type="password" placeholder="Nuova password" required minlength="6" autocomplete="new-password">
      <input id="confirmPassword" type="password" placeholder="Ripeti la nuova password" required minlength="6" autocomplete="new-password">
      <button type="submit">Salva nuova password</button>
    </form>

    <p id="message" class="hint"></p>
    <a href="admin.html">← Torna all'area amministratore</a>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-config.js"></script>
<script>
const client = supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById('message');

client.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    message.textContent = 'Link valido. Inserisci la nuova password.';
  }
});

(async () => {
  const { data } = await client.auth.getSession();

  if (!data.session) {
    message.textContent = 'Il link di recupero non è più valido o è già stato utilizzato. Richiedi un nuovo link dall’area amministratore.';
  }
})();

document.getElementById('resetForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const password = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    message.textContent = 'Le due password non coincidono.';
    return;
  }

  message.textContent = 'Salvataggio della nuova password…';

  const { error } = await client.auth.updateUser({ password });

  if (error) {
    message.textContent = 'Errore: ' + error.message;
    return;
  }

  message.textContent = 'Password aggiornata. Ora puoi accedere.';
  setTimeout(() => {
    window.location.href = 'admin.html';
  }, 1500);
});
</script>
</body>
</html>
