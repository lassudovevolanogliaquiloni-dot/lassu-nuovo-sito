<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galleria fotografica — Lassù dove Volano gli Aquiloni</title><link rel="stylesheet" href="style.css?v=20261010j"><style>.gallery-page{width:min(1100px,100%);margin:auto;padding:100px 24px 50px;background:#e2f8fc;min-height:100vh}.gallery-page-header{text-align:center;margin-bottom:30px}.gallery-page-header h1{font-size:34px;color:#0767b1}.gallery-page-header p{font-size:14px;color:#4c6d86}.gallery-page-back{display:inline-block;background:#f04b4d;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;font-size:12px;text-decoration:none}.gallery-page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gallery-page-photo{display:block;background:#fff;border:7px solid #fff;border-radius:12px;overflow:hidden}.gallery-page-photo img{display:block;width:100%;height:260px;object-fit:cover}@media(max-width:700px){.gallery-page-grid{grid-template-columns:1fr}.gallery-page-photo img{height:auto}}</style></head><body><section class="gallery-page"><div class="gallery-page-header"><div class="round-icon red" style="margin:auto">▧</div><h1>Galleria fotografica</h1><p>Scatti, emozioni e sorrisi delle nostre attività e dei nostri eventi.</p><a class="gallery-page-back" href="./">← Torna al sito</a></div><div class="gallery-page-grid" id="galleryPageGrid"><div>Caricamento foto...</div></div></section><script>const U='https://chvwxkuawstogkkxoplm.supabase.co',K='sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N';(async()=>{try{const r=await fetch(U+'/rest/v1/gallery?select=*&order=created_at.desc',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'}),p=await r.json(),b=document.querySelector('#galleryPageGrid');if(!p.length){b.innerHTML='<div>Non ci sono ancora foto nella galleria.</div>';return}b.innerHTML=p.map(x=>'<a class="gallery-page-photo" href="'+x.image_url+'"><img src="'+x.image_url+'" alt="Foto della galleria" loading="lazy"></a>').join('')}catch(e){document.querySelector('#galleryPageGrid').innerHTML='<div>Impossibile caricare le foto.</div>'}})();</script></body></html>
