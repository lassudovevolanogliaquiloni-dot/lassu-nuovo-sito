<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galleria fotografica — Lassù dove Volano gli Aquiloni</title><link rel="stylesheet" href="style.css?v=20261010j"><style>.gallery-page{width:min(1100px,100%);margin:auto;padding:100px 24px 50px;background:#e2f8fc;min-height:100vh}.gallery-page-header{text-align:center;margin-bottom:30px}.gallery-page-header h1{font-size:34px;color:#0767b1}.gallery-page-header p{font-size:14px;color:#4c6d86}.gallery-page-back{display:inline-block;background:#f04b4d;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;font-size:12px;text-decoration:none}.gallery-page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gallery-page-photo{display:block;background:#fff;border:7px solid #fff;border-radius:12px;overflow:hidden}.gallery-page-photo img{display:block;width:100%;height:260px;object-fit:cover}@media(max-width:700px){.gallery-page-grid{grid-template-columns:1fr}.gallery-page-photo img{height:auto}}.gallery-event{margin:0 0 18px;background:#fff;border-radius:18px;box-shadow:0 6px 18px rgba(7,103,177,.10);overflow:hidden}.gallery-event h2{margin:0;padding:22px 24px;color:#0767b1;font-size:24px;cursor:pointer;position:relative}.gallery-event h2:after{content:"＋";position:absolute;right:24px;font-size:28px;color:#f04b4d}.gallery-event.open h2{border-bottom:1px solid #d9edf5}.gallery-event.open h2:after{content:"−"}.gallery-event .gallery-page-grid{display:none;padding:20px}.gallery-event.open .gallery-page-grid{display:grid}.gallery-empty{background:#fff;border-radius:12px;padding:20px;text-align:center;color:#4c6d86}.gallery-page-photo{cursor:zoom-in;transition:transform .18s,box-shadow .18s}.gallery-page-photo:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(7,103,177,.18)}.gallery-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:30px;opacity:0;pointer-events:none;transition:opacity .2s}.gallery-lightbox.open{opacity:1;pointer-events:auto}.gallery-lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}.gallery-lightbox-close{position:absolute;right:22px;top:14px;border:0;background:#fff;color:#0767b1;width:42px;height:42px;border-radius:50%;font-size:28px;line-height:42px;cursor:pointer}.gallery-lightbox-caption{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:16px}</style></head><body><section class="gallery-page"><div class="gallery-page-header"><div class="round-icon red" style="margin:auto">▧</div><h1>Galleria fotografica</h1><p>Scatti, emozioni e sorrisi delle nostre attività e dei nostri eventi.</p><a class="gallery-page-back" href="./">← Torna al sito</a></div><div id="gallerySections"><div>Caricamento foto...</div></div></section><div class="gallery-lightbox" id="galleryLightbox" role="dialog" aria-modal="true"><button class="gallery-lightbox-close" id="galleryLightboxClose" aria-label="Chiudi">×</button><img id="galleryLightboxImg" src="" alt=""><div class="gallery-lightbox-caption" id="galleryLightboxCaption"></div></div><script>const U='https://chvwxkuawstogkkxoplm.supabase.co',K='sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const sectionName=url=>{try{const u=new URL(url);const saved=u.searchParams.get('section')||new URLSearchParams(u.hash.replace(/^#/, '')).get('section');if(saved)return saved;const parts=u.pathname.split('/').filter(Boolean);const i=parts.lastIndexOf('gallery');if(i>=0&&parts[i+1]&&parts[i+1]!==parts[parts.length-1])return parts[i+1].replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());return'Generale'}catch(e){return'Generale'}};(async()=>{try{const r=await fetch(U+'/rest/v1/gallery?select=*&order=created_at.desc',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'}),p=await r.json(),root=document.querySelector('#gallerySections');if(!r.ok)throw new Error(p.message||p.details||('HTTP '+r.status));if(!Array.isArray(p))throw new Error('Risposta non valida dal database');if(!p.length){root.innerHTML='<div class="gallery-empty">Non ci sono ancora foto nella galleria.</div>';return}const groups={};p.forEach(x=>{const name=sectionName(x.image_url);(groups[name]??=[]).push(x)});root.innerHTML=Object.entries(groups).map(([name,items])=>'<section class="gallery-event"><h2 tabindex="0" role="button" aria-expanded="false">'+esc(name)+' <small style="font-size:13px;color:#4c6d86;font-weight:400">('+items.length+' foto)</small></h2><div class="gallery-page-grid">'+items.map(x=>'<a class="gallery-page-photo" href="'+esc(x.image_url)+'" data-section="'+esc(name)+'"><img src="'+esc(x.image_url)+'" alt="'+esc(name)+'" loading="lazy"></a>').join('')+'</div></section>').join('');document.querySelectorAll('.gallery-event h2').forEach(h=>{const toggle=()=>{const s=h.parentElement;s.classList.toggle('open');h.setAttribute('aria-expanded',s.classList.contains('open'))};h.addEventListener('click',toggle);h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});document.querySelectorAll('.gallery-page-photo').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelector('#galleryLightboxImg').src=a.href;document.querySelector('#galleryLightboxImg').alt=a.dataset.section||'';document.querySelector('#galleryLightboxCaption').textContent=a.dataset.section||'';document.querySelector('#galleryLightbox').classList.add('open')}))}catch(e){document.querySelector('#gallerySections').innerHTML='<div class="gallery-empty">Impossibile caricare le foto. Riprova tra poco.</div>'}})();document.querySelector('#galleryLightboxClose').addEventListener('click',()=>document.querySelector('#galleryLightbox').classList.remove('open'));document.querySelector('#galleryLightbox').addEventListener('click',e=>{if(e.target.id==='galleryLightbox')e.currentTarget.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#galleryLightbox').classList.remove('open')});</script></body></html>
