<body>

<script>
(async()=>{
 const el=document.getElementById('storyContent');
 try{
  const r=await fetch('https://chvwxkuawstogkkxoplm.supabase.co/rest/v1/site_content?select=storia&id=eq.1',{headers:{apikey:'sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N',Authorization:'Bearer sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N'},cache:'no-store'});
  if(!r.ok) throw new Error();
  const rows=await r.json();
  el.textContent=rows[0]?.storia||'Inserisci la storia dell’Associazione dal pannello amministratore.';
 }catch(e){el.textContent='Inserisci la storia dell’Associazione dal pannello amministratore.';}
