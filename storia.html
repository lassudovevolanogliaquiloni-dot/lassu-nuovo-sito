<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La nostra storia — Lassù dove Volano gli Aquiloni</title>
<link rel="stylesheet" href="style.css?v=20261010i">
<style>
.history-page{min-height:100vh;background:#e8f6ff;padding:90px 24px 60px}
.history-wrap{width:min(900px,100%);margin:auto}
.history-header,.history-content{background:#fff;border-radius:22px;padding:30px;box-shadow:0 5px 18px rgba(7,103,177,.1)}
.history-header{text-align:center;margin-bottom:24px}
.history-header h1{color:#0767b1;font-size:34px;margin:12px 0}
.history-header p,.history-content p{color:#4c6d86;line-height:1.7}
.history-back{display:inline-block;background:#f04b4d;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;text-decoration:none;font-size:12px}
.history-content h2{color:#0767b1;margin-top:0}
.history-placeholder{background:#e8f6ff;border-radius:16px;padding:22px;margin-top:20px}
@media(max-width:700px){.history-page{padding:70px 16px 40px}}
</style>
</head>
<body>
<main class="history-page">
<div class="history-wrap">
<header class="history-header">
<div class="round-icon blue" style="margin:auto">👥</div>
<h1>La nostra storia</h1>
<p>La storia dell'Associazione Lassù dove Volano gli Aquiloni.</p>
<a class="history-back" href="./">← Torna al sito</a>
</header>
<section class="history-content">
<h2>La storia dell'Associazione</h2>
<div class="history-placeholder">
<p>Qui inseriremo la storia dell'Associazione: le sue origini, le persone che l'hanno fondata, i momenti più importanti e il percorso che ci ha portato fino a oggi.</p>
</div>
</section>
</div>
</main>
</body>
</html>
