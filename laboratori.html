<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratori — Lassù dove Volano gli Aquiloni</title><link rel="stylesheet" href="style.css?v=20261010i"><style>
.cat-page{min-height:100vh;background:#ffe9ed;padding:90px 24px 60px}.cat-wrap{width:min(1000px,100%);margin:auto}.cat-head,.cat-content{background:#fff;border-radius:22px;padding:30px;box-shadow:0 5px 18px rgba(7,103,177,.1);margin-bottom:22px}.cat-head{text-align:center}.cat-head h1{color:#0767b1;font-size:34px;margin:12px 0}.cat-head p,.cat-content p{color:#4c6d86;line-height:1.6}.back{display:inline-block;background:#f04b4d;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;text-decoration:none;font-size:12px}.event-card{border:1px solid #d9edf5;border-radius:16px;padding:20px;margin-top:16px}.event-card h2{color:#0767b1;margin:8px 0}.event-meta{color:#f04b4d;font-weight:700;font-size:14px}.event-poster{width:100%;max-height:360px;object-fit:cover;border-radius:12px;margin-bottom:14px}.empty{background:#f8fcfd;border-radius:14px;padding:25px;text-align:center;color:#4c6d86}
</style></head><body><main class="cat-page"><div class="cat-wrap"><header class="cat-head"><div class="round-icon red" style="margin:auto">✎</div><h1>Laboratori</h1><p>Attività creative ed educative dell'Associazione.</p><a class="back" href="attivita.html?v=20261010l">← Torna alle attività</a></header><section class="cat-content"><h2>Eventi e iniziative</h2><div class="empty">Gli eventi di questa sezione verranno pubblicati qui.</div></section></div></main><script>
const U='https://chvwxkuawstogkkxoplm.supabase.co',K='sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function fmt(s){if(!s)return 'Data da definire';return new Date(s+'T00:00:00').toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});}
(async()=>{try{const r=await fetch(U+'/rest/v1/activity_events?select=*&category=eq.laboratori&published=eq.true&order=event_date.desc',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});if(!r.ok)throw new Error();const rows=await r.json();const box=document.getElementById('activityEvents');if(!rows.length){box.innerHTML='<div class="empty">Nessun evento pubblicato in questa sezione.</div>';return;}box.innerHTML=rows.map(e=>'<article class="event-card">'+(e.poster_url?'<img class="event-poster" src="'+esc(e.poster_url)+'" alt="Locandina '+esc(e.title)+'">':'')+'<div class="event-meta">'+esc(fmt(e.event_date))+(e.place?' · '+esc(e.place):'')+'</div><h2>'+esc(e.title)+'</h2><p>'+esc(e.description||'')+'</p></article>').join('');}catch(e){document.getElementById('activityEvents').innerHTML='<div class="empty">Non è stato possibile caricare gli eventi.</div>';}})();
</script></body></html>
