<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso amministratore</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="login" class="login">
  <div class="login-box">
    <h1>Area amministratore</h1>
    <p>Gestisci gli eventi dell'associazione.</p>

    <form id="loginForm">
      <input id="email" type="email" autocomplete="email"
             placeholder="Email" required>

      <input id="password" type="password" autocomplete="current-password"
             placeholder="Password" required>

      <button type="button" onclick="document.getElementById('loginMessage').textContent='Pulsante premuto.'; window.avviaLogin(event)">Accedi</button>
    </form>

    <button id="forgotPassword" type="button" onclick="window.avviaRecuperoPassword()">
      Password dimenticata?
    </button>

    <p id="loginMessage" class="hint"></p>

    <a href="./">← Torna al sito</a>
  </div>
</section><section id="resetPassword" class="login hidden">
  <div class="login-box">
    <h1>Nuova password</h1>
    <p>Inserisci la nuova password.</p>
    <form id="resetPasswordForm">
      <input id="newPassword" type="password" placeholder="Nuova password" required minlength="6">
      <input id="confirmPassword" type="password" placeholder="Ripeti la nuova password" required minlength="6">
      <button type="submit">Salva nuova password</button>
    </form>
    <p id="resetMessage" class="hint"></p>
  </div>
</section>
<section id="app" class="app hidden">
  <header class="top">
    <div>
      <strong>Area amministratore</strong>
      <span id="userEmail"></span>
    </div>
    <button id="logout">Esci</button>
  </header>

  <main>
    <div class="stats">
      <div>
        <b id="eventCount">0</b>
        <span>Eventi</span>
      </div>
    </div>

    <section class="panel">
      <div class="panel-title">
        <div>
          <h2>Eventi</h2>
          <p class="hint">
            Aggiungi, modifica o elimina gli appuntamenti del sito.
          </p>
        </div>

        <button id="newEvent" class="add">
          + Nuovo evento
        </button>
      </div>

      <div id="eventsList"></div>
    </section>
  </main>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close" type="button">×</button>

    <h2 id="modalTitle">Nuovo evento</h2>

    <form id="eventForm">
      <label>
        Titolo
        <input id="title" required>
      </label>

      <label>
        Data
        <input id="date" type="date">
      </label>

      <label>
        Luogo
        <input id="place">
      </label>

      <label>
        Descrizione
        <textarea id="description" rows="5"></textarea>
      </label>

      <label>
        <input id="published" type="checkbox" checked>
        Pubblicato sul sito
      </label>

      <div class="modal-actions">
        <button id="cancel" class="secondary" type="button">
          Annulla
        </button>
        <button type="submit">Salva</button>
      </div>
    </form>

    <p id="formMessage" class="hint"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-config.js"></script>
<script src="admin.js?v=20261013"></script>
<script>
window.avviaLogin = async function (event) {
  console.log('LOGIN CLICK');
  if (event) event.preventDefault();

  const message = document.getElementById('loginMessage');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    message.textContent = 'Inserisci email e password.';
    return;
  }

  message.textContent = 'Accesso in corso…';

  try {
    const loginClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const result = await loginClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (result.error) {
      console.error('Supabase login error:', result.error);
      message.textContent = 'Accesso non riuscito: ' + result.error.message;
      return;
    }

    message.textContent = 'Accesso effettuato.';
    showApp(result.data.user.email);
  } catch (e) {
    message.textContent = 'Errore: ' + (e.message || e);
  }
};

window.avviaRecuperoPassword = async function () {
  const message = document.getElementById('loginMessage');
  const email = document.getElementById('email').value.trim();

  if (!email) {
    message.textContent = 'Inserisci prima la tua email.';
    return;
  }

  message.textContent = 'Invio del link di recupero…';

  try {
    const recoveryClient = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_PUBLISHABLE_KEY
    );

    const redirectTo = window.location.origin + '/lassu-nuovo-sito/reset-password.html';

    const result = await recoveryClient.auth.resetPasswordForEmail(email, {
      redirectTo: redirectTo
    });

    if (result.error) {
      message.textContent = 'Errore: ' + result.error.message;
    } else {
      message.textContent = 'Controlla la tua email: abbiamo inviato il link per reimpostare la password.';
    }
  } catch (e) {
    message.textContent = 'Errore: ' + (e.message || e);
  }
};
</script>

<!-- deployment refresh 2026-10-09 -->
</body>
</html>
