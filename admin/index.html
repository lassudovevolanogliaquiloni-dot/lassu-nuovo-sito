<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0879c9">
  <title>Area amministratore — Lassù dove Volano gli Aquiloni</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eafbff;color:#075eaa}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .box{background:#fff;border-radius:20px;padding:28px;max-width:420px;box-shadow:0 10px 35px #075eaa22}
    h1{font-size:24px;margin:0 0 10px}.box p{font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="box"><h1>Area amministratore</h1><p>Caricamento del pannello di gestione…</p></div></div>
  <script>
    window.addEventListener('load',()=>document.getElementById('loading')?.remove());
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
