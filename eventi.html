<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventi — Lassù dove Volano gli Aquiloni</title>
<link rel="stylesheet" href="style.css?v=20261010i">
<style>
.events-page{min-height:100vh;background:#e8f6ff;padding:90px 24px 60px}.events-wrap{width:min(1000px,100%);margin:auto}
.events-header{background:#fff;border-radius:22px;padding:30px;text-align:center;box-shadow:0 5px 18px rgba(7,103,177,.1);margin-bottom:24px}.events-header h1{color:#0767b1;font-size:34px;margin:12px 0}.events-header p{color:#4c6d86;line-height:1.6}
.back{display:inline-block;background:#f04b4d;color:#fff;border-radius:22px;padding:10px 18px;font-weight:700;text-decoration:none;font-size:12px}
.events-content{background:#fff;border-radius:22px;padding:30px;box-shadow:0 5px 18px rgba(7,103,177,.1)}.events-content h2{color:#0767b1;margin-top:0}
.event-list-page{display:grid;gap:20px;margin-top:24px}.event-card-page{display:grid;grid-template-columns:240px 1fr;gap:24px;background:#e8f6ff;border-radius:18px;padding:20px}.event-poster{width:100%;height:240px;object-fit:cover;border-radius:14px;background:#fff}.event-info h3{color:#0767b1;margin:0 0 10px;font-size:24px}.event-info p{color:#4c6d86;line-height:1.6}.event-meta{font-weight:700;color:#f04b4d;margin-bottom:10px}.empty{padding:24px;background:#e8f6ff;border-radius:16px;color:#4c6d86}
@media(max-width:700px){.events-page{padding:70px 16px 40px}.event-card-page{grid-template-columns:1fr}.event-poster{height:auto;max-height:400px}}
</style>
</head>
<body>
<main class="events-page"><div class="events-wrap">
<header class="events-header"><div class="round-icon" style="margin:auto">▣</div><h1>I nostri eventi</h1><p>Scopri gli appuntamenti, le manifestazioni e le iniziative dell'Associazione.</p><a class="back" href="./">← Torna al sito</a></header>
<section class="events-content"><h2>Eventi</h2><div class="event-list-page" id="eventListPage"><div class="empty">Caricamento degli eventi...</div></div></section>
</div></main>
<script>
const U='https://chvwxkuawstogkkxoplm.supabase.co',K='sb_publishable_OoJE9LWhmmXp7Ecs5o_NBA_jmrA9d2N';
const list=document.querySelector('#eventListPage');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
(async()=>{try{
const r=await fetch(U+'/rest/v1/events?select=*&published=eq.true&order=event_date.asc',{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});
if(!r.ok)throw new Error('events'); const events=await r.json();
if(!events.length){list.innerHTML='<div class="empty">Gli eventi saranno pubblicati qui a breve.</div>';return;}
list.innerHTML=events.map(e=>{
const date=e.event_date?new Date(e.event_date).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'}):'Data da definire';
const poster=e.poster_url?'<img class="event-poster" src="'+esc(e.poster_url)+'" alt="Locandina '+esc(e.title)+'">':'<div class="event-poster"></div>';
return '<article class="event-card-page">'+poster+'<div class="event-info"><div class="event-meta">'+esc(date)+(e.place?' · '+esc(e.place):'')+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.description||'')+'</p></div></article>';
}).join('');
}catch(e){list.innerHTML='<div class="empty">Non è stato possibile caricare gli eventi. Riprova più tardi.</div>';}})();
</script>
</body>
</html>
